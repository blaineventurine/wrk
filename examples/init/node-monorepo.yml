# Workspace monorepo detected. All node_modules directories are managed as
# one unit because a single install writes them together.
- name: node
  paths:
    - node_modules
{{.Paths}}
  fingerprint:
    - "{root}/package.json"
    - "{root}/yarn.lock"
    - "{root}/.yarnrc.yml"
{{.Fingerprints}}
  hooks:
    initialize:
      - run: yarn install --frozen-lockfile
        cwd: "{root}"
